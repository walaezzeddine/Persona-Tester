                - generic [ref=e370]:
                  - paragraph [ref=e371]: "Le STG Hotel Oxford Street est situé à Londres, dans le quartier de West End, à moins de 5 minutes à pied de la station de métro Tottenham Court et des boutiques d’Oxford Street. Le Dominion Le théâtre est accessible à seulement 3 minutes à pied. L’hôtel propose 2 restaurants : le Hudson's House Restaurant & Lounge Bar et le VQ, un café-restaurant animé. Vous séjournerez à moins de 10 minutes de marche du quartier de Covent Garden et du British Museum. Le musée National Gallery se trouve à moins de 15 minutes à pied. Le bar est généralement ouvert jusque tard, tous les soirs. Une connexion Wi-Fi pour les médias sociaux et la navigation est disponible gratuitement. Chaque chambre lumineuse comprend une salle de douche privative et une télévision. Affichant une décoration de style classique, toutes les chambres du STG Hotel Oxford Street sont dotées d’un coffre-fort et d’un sèche-cheveux. Une bagagerie est disponible le jour même au prix de 10 GBP par article."
                  - paragraph [ref=e372]: Les couples apprécient particulièrement l'emplacement de cet établissement. Ils lui donnent la note de 9,5 pour un séjour à deux.
