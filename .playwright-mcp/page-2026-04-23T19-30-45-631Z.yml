              - generic [ref=e627]:
                - generic [ref=e631]:
                  - paragraph [ref=e632]: "L’établissement Hilton Garden Inn Paris La Villette vous accueille à Paris, à 3,3 km de ce lieu d’intérêt : Gare de l'Est. Il comprend un service de concierge, une terrasse, un restaurant, des hébergements non-fumeurs, ainsi qu'une connexion Wi-Fi gratuite. Cet hôtel 4 étoiles propose un bar. Vous pourrez prendre un verre au snack-bar sur place. Les hébergements disposent d'articles de toilette gratuits, et certains comprennent également un coin salon. Vous profiterez de la climatisation, d’un coffre-fort et d’une télévision à écran plat. Un petit-déjeuner buffet, continental ou américain est servi sur place. Parlant anglais, espagnol, français et italien, le personnel de la réception se tient à votre disposition pour toute question. Vous séjournerez à respectivement 3,8 km et 3,8 km de ces lieux d’intérêt : Salle de spectacles La Cigale et Gare du Nord. L'aéroport le plus proche (Aéroport de Paris - Roissy - Charles-de-Gaulle) est à 15 km."
