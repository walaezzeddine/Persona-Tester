      - main [ref=e183]:
        - article [ref=e189]:
          - heading "Déclaration d’accessibilité pour Booking.com" [level=1] [ref=e193]
          - paragraph [ref=e194]: Chez Booking.com, notre mission est de faire en sorte qu'explorer le monde soit à la portée de tous et de toutes. Nous nous engageons à offrir des expériences inclusives et sans obstacle à tous nos utilisateurs, ce qui implique de rendre nos services numériques accessibles à tous et toutes, y compris aux personnes handicapées.
          - paragraph [ref=e195]: Nous nous efforçons de renforcer en permanence l’accessibilité de nos services numériques. La présente déclaration a été préparée pour informer les utilisateurs sur la manière dont nous rendons nos services plus accessibles, notamment en nous alignant sur les normes de l’UE actuellement applicables en matière d’exigences d’accessibilité pour les produits et services TIC (« Normes d’accessibilité »). La présente déclaration d’accessibilité s’applique aux parties de nos services couvertes par l’acte européen sur l'accessibilité (EAA).
          - heading "Description des services et des mesures de renforcement de l’accessibilité" [level=2] [ref=e196]:
            - button "Description des services et des mesures de renforcement de l’accessibilité" [expanded] [ref=e197] [cursor=pointer]:
              - generic [ref=e198]: Description des services et des mesures de renforcement de l’accessibilité
              - img [ref=e200]
          - region [ref=e204]:
            - paragraph [ref=e205]: Booking.com offre aux utilisateurs la possibilité de découvrir, de rechercher, de réserver et de gérer des produits ou services liés au voyage (« Expériences de voyage »), dans les domaines de l’hébergement, de la location de voitures, des vols, des taxis et des attractions. Nos services sont destinés à être accessibles sur des sites Internet version bureau et mobiles, ainsi que sur des applications (« Plateformes »), permettant aux utilisateurs de réserver des Expériences de voyage, et qui répondent à un large éventail de besoins des utilisateurs.
            - paragraph [ref=e206]: "Plus précisément, nous visons à fournir ce qui suit :"
            - list [ref=e207]:
              - listitem [ref=e208]:
                - generic [ref=e209]:
                  - strong [ref=e210]: Contenu perceptible
                  - text: ": Toutes les informations visuelles et auditives sont présentées de manière à s’adapter aux besoins des utilisateurs."
              - listitem [ref=e211]:
                - generic [ref=e212]:
                  - strong [ref=e213]: Interface utilisable
                  - text: ": le service est entièrement navigable au clavier et fonctionne de manière transparente avec les technologies d’assistance."
              - listitem [ref=e214]:
                - generic [ref=e215]:
                  - strong [ref=e216]: Conception compréhensible
                  - text: ": notre interface utilise un langage clair et simple, elle évite toute complexité inutile."
              - listitem [ref=e217]:
                - generic [ref=e218]:
                  - strong [ref=e219]: Contenu robuste
                  - text: ": nous assurons la compatibilité avec les agents utilisateurs actuels et futurs, y compris les technologies d’assistance."
            - paragraph [ref=e220]: "Afin d’atteindre ces objectifs, nous avons pris les mesures suivantes pour fournir des services plus accessibles :"
            - list [ref=e221]:
              - listitem [ref=e222]:
                - generic [ref=e223]:
                  - strong [ref=e224]: Descriptions textuelles
                  - text: ": informations écrites détaillées disponibles dans un langage clair et simple"
              - listitem [ref=e225]:
                - generic [ref=e226]:
                  - strong [ref=e227]: Compatibilité avec les lecteurs d’écran
                  - text: ": services entièrement fonctionnels avec les lecteurs d’écran populaires (par exemple VoiceOver, Talkback, NVDA, JAWS)"
              - listitem [ref=e228]:
                - generic [ref=e229]:
                  - strong [ref=e230]: Applications Internet riches accessibles (« ARIA »)
                  - text: ": mise en œuvre des rôles et attributs ARIA"
              - listitem [ref=e231]:
                - generic [ref=e232]:
                  - strong [ref=e233]: Alternatives multimédias
                  - text: ": sous-titres, transcriptions et textes alternatifs accompagnant tout contenu visuel et multimédia, le cas échéant"
              - listitem [ref=e234]:
                - generic [ref=e235]:
                  - strong [ref=e236]: Fonctionnalité de contraste élevé et de zoom
                  - text: ": compatible avec les paramètres et les capacités de contraste et d’échelle de texte réglables pour les utilisateurs malvoyants"
              - listitem [ref=e237]:
                - generic [ref=e238]:
                  - strong [ref=e239]: Navigation simple
                  - text: ": mises en page logiques avec des en-têtes, des points de repère et des menus cohérents"
              - listitem [ref=e240]:
                - generic [ref=e241]:
                  - strong [ref=e242]: Accessibilité du clavier
                  - text: ": toutes les fonctions peuvent être commandées à l’aide du clavier"
              - listitem [ref=e243]:
                - generic [ref=e244]:
                  - strong [ref=e245]: Aide et assistance
                  - text: ": contenu étape par étape dans des formats accessibles"
              - listitem [ref=e246]:
                - generic [ref=e247]:
                  - strong [ref=e248]: Notifications d’erreur
                  - text: ": messages d’erreur clairs et descriptifs pour guider les utilisateurs dans la résolution des problèmes"
            - paragraph [ref=e249]: "De plus, afin de maintenir et de renforcer la conformité aux Normes d’accessibilité et d’améliorer l’expérience de chaque utilisateur, nous avons mis en œuvre les pratiques suivantes :"
          - heading "Formation et éducation" [level=2] [ref=e250]:
            - button "Formation et éducation" [expanded] [ref=e251] [cursor=pointer]:
              - generic [ref=e252]: Formation et éducation
              - img [ref=e254]
          - region [ref=e258]:
            - paragraph [ref=e259]: "Nous aidons nos employé(e)s à acquérir les compétences nécessaires pour que nos services restent inclusifs et conformes aux Normes d’accessibilité, en fournissant ce qui suit :"
            - list [ref=e260]:
              - listitem [ref=e261]:
                - generic [ref=e262]:
                  - strong [ref=e263]: Formation spécifique au poste et personnalisée
                  - text: ": disponible pour tous les employé(e)s sur les bonnes pratiques en matière d’accessibilité."
              - listitem [ref=e264]:
                - generic [ref=e265]:
                  - strong [ref=e266]: Directives et documentation internes
                  - text: ": fournissent des connaissances à jour aux équipes produit et complètent la formation."
          - heading "Pratiques inclusives de conception, de recherche et d’écriture" [level=2] [ref=e267]:
            - button "Pratiques inclusives de conception, de recherche et d’écriture" [expanded] [ref=e268] [cursor=pointer]:
              - generic [ref=e269]: Pratiques inclusives de conception, de recherche et d’écriture
              - img [ref=e271]
          - region [ref=e275]:
            - paragraph [ref=e276]: "Nous nous efforçons de faire en sorte que l’accessibilité soit prise en compte le plus tôt possible dans le cycle de vie des produits, en nous appuyant sur les éléments suivants :"
            - list [ref=e277]:
              - listitem [ref=e278]:
                - generic [ref=e279]:
                  - strong [ref=e280]: Système de conception accessible
                  - text: ": notre bibliothèque de composants est conçue avec des exigences d’accessibilité intégrées, ce qui garantit la cohérence de notre Plateforme."
              - listitem [ref=e281]:
                - generic [ref=e282]:
                  - strong [ref=e283]: Kit d’annotation
                  - text: ": mise en œuvre d’un kit d’annotation d’accessibilité sur mesure et d’une liste de contrôle de qualité, permettant aux concepteurs et aux rédacteurs pour l’expérience client de communiquer clairement les exigences des utilisateurs de technologies d’assistance lors du développement de fonctionnalités ou de flux."
              - listitem [ref=e284]:
                - generic [ref=e285]:
                  - strong [ref=e286]: Recherche sur l’inclusivité auprès d’utilisateurs
                  - text: ": nous menons des recherches et testons nos produits auprès de personnes en situation de handicap."
              - listitem [ref=e287]:
                - generic [ref=e288]:
                  - strong [ref=e289]: Exigences non fonctionnelles
                  - text: ": les exigences en matière d’accessibilité sont documentées et prises en compte à l’étape de la définition de la portée et des exigences du produit."
          - heading "Processus d’essai et d’assurance qualité (« QA »)" [level=2] [ref=e290]:
            - button "Processus d’essai et d’assurance qualité (« QA »)" [expanded] [ref=e291] [cursor=pointer]:
              - generic [ref=e292]: Processus d’essai et d’assurance qualité (« QA »)
              - img [ref=e294]
          - region [ref=e298]:
            - paragraph [ref=e299]: Nous visons à intégrer des pratiques de test d’accessibilité dans nos processus de développement et d’assurance qualité, en testant en permanence nos services par rapport aux dernières Normes d’accessibilité et en détectant les problèmes d’accessibilité dans notre code.
            - list [ref=e300]:
              - listitem [ref=e301]:
                - generic [ref=e302]:
                  - strong [ref=e303]: Tests automatisés
                  - text: ": utilisation d’outils tiers pour intégrer les tests d’accessibilité dans les processus de test et de publication des pipelines. De plus, nous effectuons des analyses automatisées mensuelles de nos plateformes Internet afin de détecter les problèmes d’accessibilité de manière proactive."
              - listitem [ref=e304]:
                - generic [ref=e305]:
                  - strong [ref=e306]: Tests manuels
                  - text: ": tests manuels ad hoc effectués dans le cadre des processus de développement et d’assurance qualité en pré et post-production."
              - listitem [ref=e307]:
                - generic [ref=e308]:
                  - strong [ref=e309]: Assistive Technology Lab
                  - text: ": les équipes produit ont accès à une gamme d’appareils configurés avec des technologies d’assistance pour tester facilement leurs produits."
          - heading "Audit et évaluation" [level=2] [ref=e310]:
            - button "Audit et évaluation" [expanded] [ref=e311] [cursor=pointer]:
              - generic [ref=e312]: Audit et évaluation
              - img [ref=e314]
          - region [ref=e318]:
            - paragraph [ref=e319]: "Nous effectuons régulièrement des audits avec des experts externes pour analyser notre performance :"
            - list [ref=e320]:
              - listitem [ref=e321]:
                - generic [ref=e322]:
                  - strong [ref=e323]: Audits de tiers
                  - text: ": évaluations périodiques par des experts externes en matière d’accessibilité, sur l’ensemble de nos Plateformes."
              - listitem [ref=e324]:
                - generic [ref=e325]:
                  - strong [ref=e326]: Processus de gestion des bogues et des défauts
                  - text: ": système robuste de suivi des bogues à l’échelle de la société, avec des objectifs de niveau de service définis pour tous les bogues et défauts liés à l’accessibilité identifiés lors d’audits externes."
              - listitem [ref=e327]:
                - generic [ref=e328]:
                  - strong [ref=e329]: Tenue de registre
                  - text: ": maintien de rapports internes sur la conformité en matière d’accessibilité."
              - listitem [ref=e330]:
                - generic [ref=e331]:
                  - strong [ref=e332]: Auto-audits
                  - text: ": des mécanismes d’auto-évaluation sont en place pour tenir compte de la couverture qui n’est pas prise en compte dans les audits externes."
          - heading "Prise en charge centralisée de l’accessibilité" [level=2] [ref=e333]:
            - button "Prise en charge centralisée de l’accessibilité" [expanded] [ref=e334] [cursor=pointer]:
              - generic [ref=e335]: Prise en charge centralisée de l’accessibilité
              - img [ref=e337]
          - region [ref=e341]:
            - paragraph
            - list [ref=e342]:
              - listitem [ref=e343]:
                - generic [ref=e344]: Mise en place d’une équipe d’accessibilité centralisée pour fournir des conseils et une assistance à toutes les équipes produit.
              - listitem [ref=e345]:
                - generic [ref=e346]: Un groupe inter-fonctionnel a été mis en place pour soutenir les efforts en matière d’accessibilité dans l’ensemble de la société et sensibiliser les employé(e)s.
          - heading "Avis et coordonnées" [level=2] [ref=e347]:
            - button "Avis et coordonnées" [expanded] [ref=e348] [cursor=pointer]:
              - generic [ref=e349]: Avis et coordonnées
              - img [ref=e351]
          - region [ref=e355]:
            - paragraph [ref=e356]: Bien que nous visions à assurer l’accessibilité numérique pour tous les utilisateurs, certaines limitations peuvent exister. Si vous rencontrez des problèmes, cette section vous propose des moyens de nous les soumettre.
            - paragraph [ref=e357]:
              - text: Si vous avez une question concernant une réservation ou un voyage en cours, ou si vous avez besoin que nous vous répondions, veuillez consulter le
              - link "Centre d’aide" [ref=e358] [cursor=pointer]:
                - /url: https://secure.booking.com/help?label=gen173nr-10CAEoggI46AdIM1gEaKkBiAEBmAEzuAEHyAEM2AED6AEB-AEBiAIBqAIBuAKDy4vFBsACAdICJDVkZDhhMDg0LTE4ODYtNGFmNS1hOTBiLTE2ZTllMmEzNjYwZNgCAeACAQ&sid=4ab30e5cdec2a6505816b9a8bdefe1f6&aid=304142&source=header&src=profile_contact_cs
              - text: .
            - paragraph [ref=e359]: Si vous avez des questions sur votre Expérience de voyage (accès en fauteuil roulant, baignoires aménagées, etc.), veuillez contacter le prestataire de service de l’Expérience de voyage (y compris, mais sans s’y limiter, le propriétaire d’un hôtel ou d’un autre établissement, le responsable d’un musée ou d’un parc, une société de location de voitures ou le responsable d’une compagnie aérienne).
            - paragraph [ref=e360]: "Date de publication : Jun 2025"
            - paragraph [ref=e361]: "Date de la dernière mise à jour : Aug 2025"
