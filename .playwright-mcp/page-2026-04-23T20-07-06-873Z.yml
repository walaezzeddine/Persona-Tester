              - generic [ref=e533]:
                - paragraph [ref=e534]: Le Sera Lake Resort Hotel Spa & Aparts est situé à Trabzon, surplombant le lac de Sera, à 32 km de la grotte de Çal et à 35 km du plateau de Hıdırnebi. Uzungöl et sa nature luxuriante se trouvent à 111 km. Vous profiterez d'un restaurant sur place. Les chambres sont équipées d'une télévision à écran plat. Elles disposent toutes d'un coin salon ou d'un balcon pour plus de confort. Certaines bénéficient d'une terrasse ou d'un balcon. Chaque hébergement comporte une salle de bains privative pourvue d'une baignoire. Vous bénéficierez de chaussons et d'articles de toilette gratuits. Le Sera Lake Resort Hotel Spa & Aparts comporte une réception ouverte 24h/24. Le centre commercial Forum Trabzon est installé à 19 km et l'aéroport de Trabzon est implanté à 21 km. La mosquée Sainte-Sophie se situe à 13 km de l'établissement et le monastère de Soumela à 63 km.
                - paragraph [ref=e535]: Les couples apprécient particulièrement l'emplacement de cet établissement. Ils lui donnent la note de 9,1 pour un séjour à deux.
