                - heading "Bénéficiez d'un traitement VIP grâce au service exclusif de l'établissement SO/ Paris Hotel" [level=3] [ref=e667]
                - paragraph [ref=e668]: "L’établissement SO/ Paris Hotel bénéficie d’un emplacement attractif à Paris. Il possède une connexion Wi-Fi gratuite, un service de prêt de vélos, une salle de sport des hébergements dotés de la climatisation. Il est pourvu d'un service d'étage, d’un restaurant et d'une terrasse. Un parking privé est disponible sur place. Les hébergements comprennent une armoire, une télévision à écran plat, une salle de bains privative, du linge de lit et des serviettes. Vous bénéficierez d'une machine à café. Certains hébergements possèdent également un balcon et d'autres offrent une vue sur la ville. Vous profiterez aussi d’un coffre-fort. Un petit-déjeuner buffet, continental ou anglais/irlandais complet est servi sur place. Parlant allemand, anglais, espagnol et français, le personnel de la réception ouverte 24h/24 se tient en permanence à votre disposition pour toute question. Vous séjournerez à proximité de ces lieux d’intérêt : Gare de Lyon, Cathédrale Notre-Dame de Paris et Sainte-Chapelle. L'aéroport le plus proche (Aéroport de Paris - Orly) est à 16 km."
                - paragraph [ref=e669]: Les couples apprécient particulièrement l'emplacement de cet établissement. Ils lui donnent la note de 9,1 pour un séjour à deux.
