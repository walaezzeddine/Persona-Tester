                - generic [ref=e530]:
                  - paragraph [ref=e531]: Le Central Hôtel Paris est situé dans le quartier parisien de Montparnasse, entre la gare Montparnasse et le jardin du Luxembourg. Il propose des chambres dotées d'une salle de bains privative et une connexion Wi-Fi disponible gratuitement dans tout l'hôtel. Les chambres du Central Hôtel Paris comprennent une télévision par satellite, un téléphone et un bureau. Les salles de bains privatives sont dotées d'une douche ou d'une baignoire. Toutes les chambres sont accessibles par un ascenseur. Un petit-déjeuner continental est servi tous les jours à l'hôtel. La réception est ouverte 24h/24. La station de métro la plus proche est la station Gaîté, qui permet d'accéder aux Champs-Élysées. La gare et station de métro Montparnasse se trouve à 5 minutes à pied de l'hôtel et vous pourrez y prendre une navette pour les aéroports Charles de Gaulle et Orly. Le jardin du Luxembourg se situe à seulement 1 km.
                  - paragraph [ref=e532]: Les couples apprécient particulièrement l'emplacement de cet établissement. Ils lui donnent la note de 9,4 pour un séjour à deux.
                  - paragraph [ref=e533]: Les distances indiquées dans la description de l'établissement sont calculées avec © OpenStreetMap.
