      - generic [ref=e3288]:
        - heading "Une ville empreinte d’amour, de culture et de gastronomie" [level=2] [ref=e3290]
        - generic [ref=e3292]:
          - paragraph [ref=e3293]: Symbole d’amour et ville la plus visitée du monde, la magnifique Paris a vraiment tout pour plaire ! Les cafés romantiques de Montparnasse, les bistrots animés du Quartier latin et les boutiques de haute couture luxueuses des Champs-Élysées attendent seulement de se dévoiler sous vos yeux.
          - paragraph [ref=e3294]: Vous pourrez admirer la vue depuis l’emblématique tour Eiffel, vous amuser à Disneyland ou vous plonger dans l’atmosphère artistique de Montmartre. Ne manquez pas de visiter le Louvre pour tenter de serrer la main à la Vénus de Milo et de percer le mystère du sourire de Mona Lisa.
          - paragraph [ref=e3295]: Le soir, le célèbre Moulin Rouge propose des spectacles de cabaret passionnants, tandis que l’Opéra Garnier, datant du XIXe siècle, vous invite à vous installer confortablement dans ses fauteuils opulents. La cuisine française, de renommée mondiale, vous sera servie dans les innombrables bistrots, brasseries et restaurants parisiens !
          - paragraph [ref=e3296]: Grâce à l’excellent réseau de transports en commun de la ville, quel que soit l’aéroport international auquel vous arriverez, Orly ou Charles de Gaulle, tous les sites touristiques sont facilement accessibles. Que vous cherchiez une chambre offrant une vue sur Notre-Dame, un hôtel design à l’intérieur chic ou un appartement confortable, Booking.com a ce qu’il faut pour répondre à vos besoins de vacances.
