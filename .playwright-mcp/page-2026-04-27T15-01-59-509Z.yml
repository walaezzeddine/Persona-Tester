                - generic [ref=e530]:
                  - paragraph [ref=e531]: Situé à seulement 350 mètres du centre commercial et de la tour Montparnasse, l'hôtel Apollinaire se trouve au cœur d'un quartier résidentiel animé de Paris. Sa réception est ouverte 24h/24 et une connexion Wi-Fi est disponible gratuitement dans tout l'établissement. Les chambres climatisées possèdent une télévision et un minibar. Toutes les chambres sont accessibles par ascenseur et disposent de leur propre salle de bains avec baignoire ou douche. Vous pourrez savourer votre petit-déjeuner dans votre chambre ou bien sous forme de buffet. Vous rejoindrez de célèbres cafés et restaurants tels que La Coupole, Le Café du Dôme et La Rotonde en moins de 5 minutes de marche depuis l'hôtel Apollinaire. La station de métro et la gare Montparnasse se trouvent également à 5 minutes à pied. Le métro offre des liaisons directes vers la cathédrale Notre-Dame, la tour Eiffel et le parc des expositions de la porte de Versailles.
                  - paragraph [ref=e532]: Les couples apprécient particulièrement l'emplacement de cet établissement. Ils lui donnent la note de 9,4 pour un séjour à deux.
                  - paragraph [ref=e533]: Les distances indiquées dans la description de l'établissement sont calculées avec © OpenStreetMap.
