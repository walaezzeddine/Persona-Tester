                    - generic [ref=e615]: L'établissement Oxbridge Apartments n'est généralement pas disponible sur notre site. Réservez avant qu'il ne soit trop tard !
                - generic [ref=e618]:
                  - generic [ref=e619]:
                    - paragraph [ref=e620]: La luxueuse résidence Oxbridge Apartments propose des hébergements indépendants dans le quartier chic de Kensington, à seulement 5 minutes de la station de métro Gloucester Road. Elle dispose d'une réception ouverte 24h/24 et d'une connexion Wi-Fi gratuite. Tous les appartements comportent une cuisine entièrement équipée avec four, four micro-ondes, réfrigérateur et lave-linge. Les ustensiles de cuisine sont également fournis. Tous les logements comprennent une télévision par satellite à écran plat et certains possèdent un coin salon. Les salles de bains modernes sont pourvues d'une douche, d'un sèche-cheveux et d'articles de toilette gratuits. Vous aurez le choix entre des studios et des appartements composés de 1 ou 2 chambres. La station de métro Gloucester Road, située à proximité, vous permettra de rejoindre directement les stations Knightsbridge, Leicester Square, Covent Garden et London Victoria, entre autres. L'Oxbridge Apartments se trouve à environ 10 minutes à pied des nombreux restaurants et du parc des expositions d'Earls Court.
                    - paragraph [ref=e621]: Les couples apprécient particulièrement l'emplacement de cet établissement. Ils lui donnent la note de 8,9 pour un séjour à deux.
