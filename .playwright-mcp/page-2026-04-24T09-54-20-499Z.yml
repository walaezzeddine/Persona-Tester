              - generic [ref=e533]:
                - generic [ref=e534]:
                  - paragraph [ref=e535]: "L’établissement Hotel Admeto se situe à Marinella di Selinunte, à 300 mètres de ce lieu d’intérêt : Plage Calannino. Il possède un salon commun, une terrasse, un restaurant et un parking privé. Cet hôtel 4 étoiles propose un bar. L’établissement comprend une réception ouverte 24h/24, des transferts aéroport, un service d'étage et une connexion Wi-Fi gratuite dans l’ensemble de ses locaux. Les hébergements sont dotés de la climatisation, d’un bureau, d’un coffre-fort, d’une télévision à écran plat, d’un balcon et d’une salle de bains privative avec un bidet. Les hébergements sont pourvus d'une douche, et certains comportent également un coin salon. Vous profiterez aussi d’un minibar. La région est prisée des amateurs de vélo et l’établissement Hotel Admeto assure des services de location de vélos et de location de voitures. Vous séjournerez à 1,9 km de ce lieu d’intérêt : Ancienne cité de Sélinonte. L'aéroport le plus proche (Aéroport de Trapani) est à 68 km."
                  - paragraph [ref=e536]: Les couples apprécient particulièrement l'emplacement de cet établissement. Ils lui donnent la note de 8,9 pour un séjour à deux.
