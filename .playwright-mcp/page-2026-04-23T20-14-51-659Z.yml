                - generic [ref=e391]:
                  - paragraph [ref=e392]: "L’établissement Prens Hotel-Aksaray Tram Station & Yenikapi Metro Station Just Five Min By Walking vous accueille à Istanbul, à 1,7 km de ce lieu d’intérêt : Mosquée Süleymaniye. Il possède une terrasse, des hébergements non-fumeurs, ainsi qu'une connexion Wi-Fi gratuite dans l’ensemble de ses locaux. Il est installé à respectivement 3,2 km, 3,3 km et 3,6 km de : Bazar aux épices, Mosquée Bleue et Citerne Basilique. Vous profiterez d'un bureau d'excursions et d'un service de change. Les hébergements comprennent la climatisation, un bureau, une bouilloire, un coffre-fort, une télévision à écran plat et une salle de bains privative dotée d’une douche. Vous profiterez aussi d’une armoire. L’établissement Prens Hotel-Aksaray Tram Station & Yenikapi Metro Station Just Five Min By Walking sert un petit-déjeuner buffet ou halal. Vous séjournerez à respectivement 1,9 km et 4 km de ces lieux d’intérêt : Colonne de Constantin et Palais de Topkapi. L'aéroport le plus proche (Aéroport international Sabiha-Gökçen d'Istanbul) est à 37 km."
