                - generic [ref=e641]:
                  - paragraph [ref=e642]: "Situé à Paris et offrant une vue sur la ville, l’établissement Zoku Paris comprend une salle de sport, un salon commun, une terrasse, un restaurant et un bar. Une connexion Wi-Fi gratuite est à votre disposition dans l’ensemble de ses locaux. Les hébergements sont dotés d’un coin salon avec une télévision à écran plat, ainsi que d’une salle de bains privative comprenant des articles de toilette gratuits, un sèche-cheveux et une douche. Certains logements disposent également d’une cuisine équipée d’un réfrigérateur, d’un lave-vaisselle et d’un micro-ondes. L’établissement Zoku Paris sert un petit-déjeuner buffet ou continental. Un service de location de vélos est disponible sur place. Vous séjournerez à respectivement 3,1 km et 3,2 km de ces lieux d’intérêt : Palais des congrès de Paris et Arc de Triomphe. L'aéroport le plus proche (Aéroport de Paris - Roissy - Charles-de-Gaulle) est à 21 km."
