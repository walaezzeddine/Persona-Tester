                - generic [ref=e2145]:
                  - paragraph [ref=e2146]: Informations sur la société
                  - generic [ref=e2147]: Grâce à son concept hybride de maison-bureau primé, Zoku réinvente le secteur de l’hôtellerie en proposant une nouvelle catégorie d’hébergement. Fondé en 2016 par deux entrepreneurs néerlandais, Hans Meyer et Marc Jongerius, Zoku tire son nom d’un terme japonais signifiant famille, tribu ou clan. Zoku facilite la vie et le travail à l’international, ainsi que le tourisme écoresponsable, pour toute une population de globetrotters professionnels, de digital nomads et de télétravailleurs.
                  - paragraph [ref=e2148]: Informations sur l'hébergement
                  - generic [ref=e2149]: "Zoku Paris propose 109 Lofts : des chambres intelligentes et privées de style appartement qui contiennent un lit en mezzanine, un salon, une cuisine, une salle de bain et une grande table pour 4 personnes. Le Zoku Loft, primé, est un micro-appartement spacieux qui convient aussi bien à la vie qu'au travail. Il est conçu pour inviter des amis et des collègues à la maison, pour travailler sur plusieurs fuseaux horaires ou pour accomplir n'importe quel travail tout en explorant la ville. Chaque Loft peut accueillir deux personnes, à l'exception du Loft XXL qui peut en accueillir quatre, et est équipé de la climatisation, d'une télévision intelligente et d'une connexion Wi-Fi gratuite à haut débit (60 mbps). Il est même possible de personnaliser son espace en choisissant ses œuvres d'art préférées à accrocher aux murs pour s'inspirer pendant son séjour. Lorsque l'on a envie de quitter son espace privé pour socialiser, nos espaces sociaux sur le toit au 8ème étage comprennent le Living Room, le Kindred Spirits Bar, le restaurant Living Kitchen, des espaces de coworking, des salles de réunion, un espace événementiel et une spacieuse terrasse extérieure sur le toit pour répondre à tous les besoins amusants et pratiques du mélange international de résidents de Zoku. Les fenêtres du sol au plafond du toit offrent une lumière naturelle abondante, permettant de faire une pause bien méritée dans l'agitation de la ville et d'avoir une vue unique sur l'emblématique Tribunal de Paris. Les espaces partagés sont accessibles 24 heures sur 24, 7 jours sur 7, et une équipe de \"Sidekicks\" est là pour t'aider pendant ton séjour."
                  - paragraph [ref=e2150]: Informations sur le quartier
                  - generic [ref=e2151]: "Zoku Paris est situé dans le 17e arrondissement, à quelques stations du centre-ville : un quartier vivant, éclectique et populaire réputé pour ses nombreux bars et restaurants branchés. Idéal pour s’échapper au tumulte du centre de Paris, l’établissement se trouve à 10 min en voiture du cœur de la capitale et à 5 min de la station de métro et RER Porte de Clichy qui vous relie à la Gare du Nord (Thalys et Eurostar)."
