                - generic [ref=e2484]:
                  - paragraph [ref=e2485]: Veuillez noter que la réception est ouverte 24h/24 et que l’enregistrement est possible à partir de 15h00. Vous n’êtes pas tenu d’informer l’établissement de votre heure d’arrivée prévue. Dans un souci de proposer les chambres les plus propres possible, le Zoku Paris ne propose pas d'enregistrement anticipé. Si vous arrivez avant 15h00, vous pourrez laisser vos bagages à la bagagerie sur place.
                  - paragraph [ref=e2486]: Un service de ménage hebdomadaire est assuré. Un service de ménage supplémentaire peut être demandé gratuitement.
                  - paragraph [ref=e2487]: Veuillez noter que les réservations de 5 hébergements ou plus sont possibles uniquement sur demande. Des conditions différentes et des frais supplémentaires peuvent s'appliquer pour ces réservations. Cet établissement n’accepte pas les règlements en espèces. Les coordonnées de votre carte de crédit en cours de validité seront conservées pendant la durée de votre séjour. Une carte de crédit en cours de validité doit être présentée lors de l’enregistrement. Aucune autorisation de paiement par un tiers n’est possible. Veuillez noter que le petit-déjeuner est servi de 7h00 à 10h00 en semaine et de 8h00 à 10h30 le week-end. La taxe de séjour sera facturée à votre arrivée. Le service de ménage est assuré tous les 3 jours. Un service de ménage additionnel peut être organisé sur demande et moyennant des frais supplémentaires. Lors de l’enregistrement, vous devrez présenter une pièce d’identité avec photo et une carte de crédit. Veuillez noter que toutes les demandes spéciales seront traitées sous réserve de disponibilité et pourront entraîner des frais supplémentaires. Cet établissement n’accepte pas les enterrements de vie de jeune fille/garçon et les autres fêtes similaires.
                  - paragraph [ref=e2488]: Vous devrez présenter une pièce d'identité avec photo et une carte de crédit lors de l'enregistrement. Veuillez noter que toutes les demandes spéciales seront satisfaites sous réserve de disponibilité et pourront entraîner des frais supplémentaires.
                  - paragraph [ref=e2489]: Les enterrements de vie de célibataire et autres fêtes de ce type sont interdits dans cet établissement.
                  - paragraph [ref=e2490]: Les clients âgés de moins de 18 ans doivent être accompagnés d'un parent ou d'un tuteur légal pour pouvoir s'enregistrer.
                  - paragraph [ref=e2491]: Dans le cadre de la pandémie de coronavirus (COVID-19), cet établissement applique actuellement des mesures sanitaires supplémentaires.
